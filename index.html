<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>隨手記帳</title>
<style>
:root{--bg:#f3f5f2;--sf:#fff;--tx:#1d2a26;--mu:#6b7a74;--ac:#1f6f5c;--ac2:#e8f3ef;--ln:#dde3df;--rd:#b4432f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;padding-bottom:130px;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;justify-content:space-between;align-items:center;max-width:560px;margin:0 auto;padding:12px 16px 6px;background:var(--bg)}
header b{font-size:20px}
main{max-width:560px;margin:0 auto;padding:6px 16px}
button,input,select,textarea{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:9px 10px;min-height:42px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button{border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:var(--bg);cursor:pointer;min-height:42px}
button.s{background:var(--ac2);color:var(--ac)}
button.sm{min-height:34px;padding:6px 12px;font-size:13px}
button.ic{background:none;color:var(--ac);font-size:20px;padding:4px 12px;min-height:38px}
button.lk{background:none;color:var(--mu);width:100%;margin-top:6px;font-size:13px}
label{display:block;font-size:12px;color:var(--mu);margin:0 0 3px}
.mn{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.mn b{font-size:17px}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.st>div{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px 9px}
.st>div.on{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
.st i{display:block;font-style:normal;font-size:12px;color:var(--mu)}
.st b{font-size:15px}
.dh{display:flex;justify-content:space-between;margin:16px 4px 6px;font-size:13px;color:var(--mu)}
.pn{background:var(--sf);border:1px solid var(--ln);border-radius:14px;overflow:hidden;margin-bottom:10px}
.en+.en,.pi+.pi{border-top:1px solid var(--ln)}
.sm2{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;cursor:pointer}
.sn{font-weight:600}
.ss{font-size:12px;color:var(--mu)}
.r{text-align:right;white-space:nowrap}
.a1{font-weight:700}
.a2{font-size:12px;color:var(--ac)}
.chip{display:inline-block;margin-top:4px;font-size:11px;padding:1px 9px;border-radius:99px;background:color-mix(in srgb,var(--rd) 13%,transparent);color:var(--rd)}
.dtl{padding:0 14px 14px;font-size:13px;display:grid;gap:8px}
.dtl .g2{align-items:end}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{grid-column:1/-1}
.pi{padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.pi input{width:92px;min-height:36px;padding:5px 8px}
.pnl{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.pnl h3{margin:0 0 8px;font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}
.tb2{width:100%;border-collapse:collapse}
.tb2 th{font-weight:400;font-size:12px;color:var(--mu)}
.tb2 td,.tb2 th{padding:7px 3px;text-align:right}
.tb2 td:first-child,.tb2 th:first-child{text-align:left}
.tb2 input{width:92px;min-height:36px;padding:4px 8px;text-align:right}
.chips{display:flex;gap:8px;margin:4px 0 12px;overflow-x:auto}
.chips button{background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:99px;min-height:36px;padding:6px 16px}
.chips button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.tl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.tl div{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:15px}
.tl i{display:block;font-style:normal;font-size:11px;color:var(--mu)}
.tl input{min-height:30px;padding:2px 6px;text-align:left;background:var(--sf)}
.bar{height:6px;background:var(--ac2);border-radius:9px;overflow:hidden;margin-top:4px}
.bar span{display:block;height:100%;background:var(--ac)}
.mu{color:var(--mu);font-size:12px}
.in{color:var(--ac)}
.bad{color:var(--rd)}
.em{text-align:center;color:var(--mu);padding:40px 10px}
.x{background:none;color:var(--rd);min-height:0;padding:4px 8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:8}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:14px 0}
nav button.on{color:var(--ac);font-weight:700;box-shadow:inset 0 3px 0 var(--ac)}
#fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(68px + env(safe-area-inset-bottom,0px));border-radius:99px;padding:12px 24px;box-shadow:0 4px 16px rgba(0,0,0,.22);z-index:7}
#bn{display:none;position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:5;background:var(--ac);color:var(--bg);border-radius:12px;padding:12px;margin:0 0 10px}
#bn button{background:var(--bg);color:var(--ac);margin:8px 8px 0 0}
#ov,#ov2{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
.sh{position:absolute;left:0;right:0;bottom:0;margin:0 auto;width:100%;max-width:560px;max-height:94%;overflow:auto;background:var(--sf);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.shh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:17px}
#f-amt,#f-ex{font-size:20px;font-weight:700}
.ro{min-height:42px;display:flex;align-items:center;color:var(--ac);font-weight:700}
details{margin:12px 0 0}
summary{cursor:pointer;color:var(--ac);padding:6px 0}
details .g2{margin-top:8px}
#ts{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:130px;background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:99px;z-index:30;font-size:13px}
.sr{display:flex;gap:8px;margin:0 0 10px}
.sr select{flex:0 0 38%;min-width:0}
.sr input{flex:1;min-width:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:8px 6px;margin-bottom:6px;text-align:center}
.cal i{font-style:normal;font-size:11px;color:var(--mu);padding:2px 0}
.cal .cd{position:relative;background:none;color:var(--ln);min-height:40px;padding:0;border-radius:10px;font-size:14px}
.cal .cd.has{color:var(--tx);font-weight:600;cursor:pointer}
.cal .cd.has::after{content:"";position:absolute;left:50%;bottom:5px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--ac)}
.cal .cd.has:active{background:var(--ac2)}
.cal .cd.td{box-shadow:inset 0 0 0 1.5px var(--ac)}
.dh{scroll-margin-top:68px}
.dh.fl{animation:fl 1.6s ease-out}
@keyframes fl{0%,40%{background:var(--ac2)}100%{background:transparent}}
.mcs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.mc{background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:14px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:0}
.mc.on{border-color:var(--ac);box-shadow:inset 0 0 0 1.5px var(--ac)}
.mc i{font-style:normal;font-size:11px;color:var(--mu)}
.mc .mm{font-size:18px;font-weight:700}
.mc small{font-size:11px;font-weight:600;margin-top:2px}
.mc b{font-size:16px}
.mc em{font-style:normal;font-size:11px;color:var(--mu);line-height:1.5;margin-top:4px}
.add{grid-template-columns:1fr 1.2fr auto;margin-top:8px;align-items:center}
.tot{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:12px;margin-top:10px;font-size:17px}
.tot.need{background:color-mix(in srgb,var(--rd) 10%,transparent)}
.tot.ok{background:var(--ac2)}
#top{position:fixed;right:14px;bottom:calc(72px + env(safe-area-inset-bottom,0px));width:44px;height:44px;min-height:0;padding:0;border-radius:50%;background:var(--sf);color:var(--ac);border:1px solid var(--ln);box-shadow:0 2px 10px rgba(0,0,0,.18);font-size:20px;z-index:7;opacity:0;pointer-events:none;transition:opacity .2s}
#top.show{opacity:1;pointer-events:auto}
.seg{display:flex;background:var(--ac2);border-radius:12px;padding:3px;gap:2px;margin-bottom:12px}
.seg button{flex:1;background:none;color:var(--ac);border-radius:10px;min-height:36px;padding:6px 8px;font-weight:600}
.seg button.on{background:var(--sf);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.seg.sm{margin:0}
.seg.sm button{min-height:32px;font-size:13px;padding:4px 14px;white-space:nowrap}
.flow{padding:16px 14px}
.fh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.fh i{display:block;font-style:normal;font-size:12px;color:var(--mu)}
.big{font-size:30px;line-height:1.2}
.fs{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding:8px 10px;border-radius:10px;font-weight:700;background:var(--bg)}
.fs.in{background:var(--ac2)}
.fs.bad{background:color-mix(in srgb,var(--rd) 10%,transparent)}
.fl2{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);margin:10px 4px 0}
.fr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 4px;border-bottom:1px solid var(--ln)}
.fr:last-of-type{border-bottom:0}
.bk{padding:10px 4px;border-bottom:1px solid var(--ln)}
.bt{display:flex;justify-content:space-between;align-items:baseline;font-size:16px}
.bs{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
.bkr{display:flex;align-items:center;gap:6px}
.bkr label{margin:0}
.bkr input{width:104px;min-height:34px;padding:3px 8px;text-align:right}
.fadd{margin-top:16px;padding-top:14px;border-top:1px dashed var(--ln);display:grid;gap:8px}
.fadd .seg{margin:0}
.ibar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0 12px}
.ic2{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:10px;display:grid;gap:10px}
.ic2.dn{background:transparent}
.ic2.dn .a1,.ic2.dn .sn{color:var(--mu)}
.ic2.dn .bar span{background:var(--mu);opacity:.45}
.ih{display:flex;justify-content:space-between;gap:12px}
.im{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mu);flex-wrap:wrap}
.tgs{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.tg{font-size:11px;font-weight:600;padding:1px 9px;border-radius:99px}
.tg.no{background:color-mix(in srgb,var(--rd) 14%,transparent);color:var(--rd)}
.tg.wn{background:#fff0c2;color:#7a5a00}
.rw{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:0 14px 12px;font-size:13px;color:var(--mu)}
.rw b{color:var(--tx)}
.rwi{display:flex;align-items:center;gap:4px}
.rwi input{width:74px;min-height:32px;padding:3px 8px}
.rs{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}
.rs.no{background:color-mix(in srgb,var(--rd) 14%,transparent);color:var(--rd)}
.rs.yes{background:var(--ac2);color:var(--ac)}
.pk{display:grid;grid-template-columns:1fr 76px auto;gap:6px;margin:8px 0}
.pk .pn{grid-column:1/-1;font-size:13px}
a{color:var(--ac)}
details.pnl summary{padding:2px 0}
details.cd{margin:0;border-top:1px dashed var(--ln)}
details.cd>summary{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--tx);padding:8px 0;list-style:none}
details.cd>summary::-webkit-details-marker{display:none}
.cn::before{content:"▸ ";color:var(--mu)}
details.cd[open] .cn::before{content:"▾ "}
.cr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0 4px 14px;font-size:13px}
.cr>span:first-child{min-width:0;overflow-wrap:anywhere}
.cr input{width:92px;min-height:32px;padding:3px 8px;text-align:right}
.cr.sub{border-top:1px solid var(--ln);margin-top:4px;padding-top:6px;font-weight:700}
.row.go{cursor:pointer}
.xp button{width:100%;margin-top:8px}
button.ic.mt{color:var(--mu);font-size:17px;padding:4px 8px;min-height:34px}
.hb{display:flex;align-items:center}
.tl4{grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0}
.tl4 div{padding:6px 7px;font-size:13px}
.mv,.ck{min-height:26px;padding:0 7px;border-radius:8px;font-size:14px;line-height:1}
.mv{background:var(--ac2);color:var(--ac)}
.ck{width:26px;padding:0;border-radius:50%;background:none;border:1px solid var(--ln);color:var(--ln);font-size:13px}
.ck.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.cr .rt{display:flex;align-items:center;gap:4px;white-space:nowrap}
.cr .lf{display:flex;align-items:center;gap:6px}
.tg{margin-left:4px}
button.tg{min-height:0;padding:1px 9px;border:0}
.bh{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px}
.bl{min-width:0}
.t4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;margin-top:5px}
.t4 div{background:var(--ac2);border-radius:8px;padding:4px 5px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:clip}
.t4 i{display:block;font-style:normal;font-size:10px;font-weight:400;color:var(--mu)}
.t4 .rf{color:var(--ac)}
.bz{font-size:16px;white-space:nowrap;text-align:right}
.cn{display:block}
.cn .sb{display:block;margin-left:14px;font-size:11px;line-height:1.4}
.xb{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;min-height:0;padding:0;margin-right:6px;border-radius:11px;background:var(--ac2);color:var(--ac);border:1px solid color-mix(in srgb,var(--ac) 22%,transparent)}
.xb svg{width:18px;height:18px}
.hb{gap:0}
.cb{padding:12px 4px;border-bottom:1px solid var(--ln)}
.cb .sb{display:block;font-size:11px;line-height:1.4;margin-top:1px}
.t4 input.tin{width:100%;min-width:0;min-height:0;border:0;background:transparent;padding:0;font:inherit;font-weight:600;color:inherit;text-align:left;border-radius:0}
.t4 input.tin::placeholder{color:var(--mu);opacity:.7}
.t4 .in{color:var(--ac)}
.t4 .bad{color:var(--rd)}
.t4 .ov i::after{content:" •";color:var(--ac)}
details.cd>summary{color:var(--mu);font-size:13px;padding:4px 0}
details.cd{border-top:0;margin-top:6px}
.nh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.nh .bz{font-size:15px}
.gp{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:8px;border-bottom:1px solid var(--ln)}
.gp .cb{border-bottom:1px dashed var(--ln);padding:11px 0}
.gp .gl>.cb:last-child{border-bottom:0}
.gr{align-self:start;margin-top:11px;background:var(--ac2);border-radius:10px;padding:8px 7px;display:flex;flex-direction:column;gap:3px;min-width:0}
.gr i{font-style:normal;font-size:10px;color:var(--mu);white-space:nowrap}
.gr input{width:100%;min-width:0;min-height:30px;padding:2px 6px;text-align:right;font-weight:600;font-size:13px}
.gr .l2{display:block;text-align:right}
.gr .l2 span{display:block;font-size:10px;line-height:1.3}
.gr .l2 b{font-size:11.5px;white-space:nowrap}
[hidden]{display:none!important}

/* ===== v2：卡費卡片重設計（統一尺寸、精簡文字）===== */
.sech{display:flex;justify-content:space-between;align-items:baseline;margin:20px 2px 0;font-size:16px}
.sech .mu{font-size:13px}
.gp{display:block;gap:0;border:0;border-top:1px solid var(--ln);margin-top:12px;padding-top:2px}
.gp .cb{border:0;padding:14px 0 4px}
.gp .cb+.cb{border-top:1px solid var(--ln);margin-top:10px;padding-top:16px}
.nh{align-items:flex-start;gap:12px}
.nm{min-width:0}
.nm b{font-size:16px}
.nm .sb{display:block;margin:3px 0 0;font-size:12px;color:var(--mu)}
.nh .bz{font-size:21px;font-weight:700;letter-spacing:-.3px}
.t4,.ar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.ar{grid-template-columns:repeat(3,minmax(0,1fr));margin:10px 0 4px}
.t4>.tl1,.ar>.tl1,.tl1{display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0;min-height:58px;padding:9px 11px;border-radius:12px;background:var(--bg);color:var(--tx);font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden}
.tl1 i{display:block;font-style:normal;font-size:11px;font-weight:500;color:var(--mu);overflow:hidden;text-overflow:ellipsis}
.tl1 b{font-size:15px;line-height:22px}
.tl1 input.tin,.t4 input.tin{width:100%;min-width:0;min-height:0;height:22px;border:0;background:transparent;padding:0;font:inherit;font-size:15px;font-weight:700;line-height:22px;color:inherit;text-align:left;border-radius:0}
.tl1.in{color:var(--ac)}
.tl1.lk.bad{background:color-mix(in srgb,var(--rd) 11%,transparent);color:var(--rd)}
.tl1.lk.in{background:var(--ac2);color:var(--ac)}
.tl1.ov i::after{content:" •";color:var(--ac)}
details.cd{margin-top:8px}
@media(max-width:359px){.t4{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ===== 匯出視窗 ===== */
#ov3{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
.xr{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}
.xr span{color:var(--mu)}
.xq{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.xs{background:var(--bg);border-radius:12px;padding:12px 14px;margin:0 0 12px;font-size:14px;color:var(--mu)}
.xs b{color:var(--tx)}
label.xo{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--tx);margin:0}
.xo input{width:20px;min-height:20px;height:20px;padding:0;flex:none}

/* ===== v3：銀行區塊 ===== */
.gp.bank{border:1.5px solid color-mix(in srgb,var(--bc) 38%,transparent);border-radius:16px;margin-top:14px;padding:0 14px 14px;overflow:hidden;background:var(--sf)}
.bh2{display:flex;align-items:baseline;gap:8px;margin:0 -14px;padding:11px 14px;background:color-mix(in srgb,var(--bc) 13%,transparent);border-bottom:1.5px solid color-mix(in srgb,var(--bc) 25%,transparent)}
.bn{font-size:17px;font-weight:800;color:var(--bc)}
.bm{font-size:12px;color:var(--mu)}
.bd{margin-left:auto;font-size:15px;font-weight:700;color:var(--bc)}
.gp.bank .cb{padding:14px 0 2px}
.gp.bank .cb+.cb{border-top:1px dashed var(--ln);margin-top:12px;padding-top:14px}
.nm b{font-size:15px}
.t4{gap:0;background:var(--bg);border-radius:12px;margin-top:10px}
.t4>.tl1{background:transparent;min-height:0;padding:9px 10px;border-radius:0}
.t4>.tl1+.tl1{border-left:1px solid var(--ln)}
.gp.bank .ar{grid-template-columns:repeat(2,minmax(0,1fr));margin:14px 0 0}
.gp.bank .ar>.tl1:not(.lk){background:color-mix(in srgb,var(--bc) 11%,transparent)}
.pdb{width:100%;margin-top:10px;min-height:38px;font-size:14px;background:transparent;color:var(--bc);border:1.5px solid color-mix(in srgb,var(--bc) 45%,transparent)}
.gp.fin{opacity:.6}
.gp.fin .pdb{background:var(--bc);color:var(--sf)}
.gp.fin .bd{color:var(--mu)}

let CURINV=null;
const invD=s=>{s=String(s==null?'':s).trim();let m,y,mo,d;
  if(m=s.match(/(\d{3,4})[-\/.年](\d{1,2})[-\/.月](\d{1,2})/)){y=+m[1];mo=+m[2];d=+m[3]}
  else if(m=s.match(/^(\d{4})(\d{2})(\d{2})(?!\d)/)){y=+m[1];mo=+m[2];d=+m[3]}
  else if(m=s.match(/^(\d{3})(\d{2})(\d{2})$/)){y=+m[1];mo=+m[2];d=+m[3]}
  else return '';
  if(y<1911)y+=1911;if(mo<1||mo>12||d<1||d>31||y>2100)return '';
  return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0')};
const invCsv=l=>{const o=[];let c='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(q){if(ch==='"'){if(l[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===','){o.push(c);c=''}else c+=ch}o.push(c);return o.map(x=>x.trim())};
const invSp=l=>l.includes('|')?l.split('|').map(x=>x.trim()):l.includes('\t')?l.split('\t').map(x=>x.trim()):invCsv(l);
const INO=/^[A-Za-z]{2}-?\d{8}$/;
function invParse(txt){
  const lines=String(txt).replace(/^﻿/,'').replace(/\r/g,'').split('\n').map(l=>l.trim()).filter(Boolean),out=[],det={};
  if(lines.some(l=>/^[MD][|,\t]/.test(l))){
    lines.forEach(l=>{const c=invSp(l);
      if(c[0]==='D'){const no=(c[1]||'').toUpperCase();if(c[3])(det[no]=det[no]||[]).push(c[3])}
      else if(c[0]==='M'){
        if(c.some(x=>/作廢|已作廢/.test(x)))return;
        const ni=c.findIndex(x=>INO.test(x)),di=c.findIndex((x,i)=>i>0&&invD(x)),ti=c.findIndex((x,i)=>i>0&&/^\d{8}$/.test(x)&&!invD(x));
        let amt=0;for(let i=c.length-1;i>0;i--){if(/^-?[\d,]+(\.\d+)?$/.test(c[i])){amt=num(c[i]);break}}
        let shop=ti>=0?c[ti+1]:'';if(!shop)shop=c.find((x,i)=>i>0&&i!==ni&&i!==di&&x&&!/^[\d,.\-\/]+$/.test(x)&&!/已|未|開立|載具|手機/.test(x))||'';
        out.push({no:ni>=0?c[ni].toUpperCase().replace('-',''):'',date:di>=0?invD(c[di]):'',shop,amt,dt:''})}});
    out.forEach(v=>{const a=det[v.no]||det[v.no.slice(0,2)+'-'+v.no.slice(2)];if(a)v.dt=[...new Set(a)].slice(0,8).join('、')});
    return out}
  const h=invSp(lines[0]);
  if(h.some(x=>/日期/.test(x))&&h.some(x=>/金額|總計|消費/.test(x))){
    const f=re=>h.findIndex(x=>re.test(x)),di=f(/日期/),si=f(/店|商家|特店/),ai=f(/金額|總計|消費/),ni=f(/號碼/),ti=f(/品名|明細|品項/);
    lines.slice(1).forEach(l=>{const c=invSp(l);if(c.some(x=>/作廢/.test(x)))return;
      out.push({no:ni>=0?(c[ni]||'').toUpperCase().replace('-',''):'',date:invD(c[di]),shop:si>=0?c[si]:'',amt:num(c[ai]),dt:ti>=0?c[ti]||'':''})});
    return out}
  lines.forEach(l=>{
    const m=l.match(/(\d{3,4}[-\/.年]\d{1,2}[-\/.月]\d{1,2}|\b\d{8}\b)/);if(!m)return;
    const date=invD(m[1]);if(!date)return;
    let rest=l.replace(m[1],' ').replace(/日/,' ');
    const am=[...rest.matchAll(/(?:NT\$|\$)?\s*(-?[\d,]+(?:\.\d+)?)\s*元?/g)].pop();if(!am)return;
    const no=((rest.match(/[A-Za-z]{2}-?\d{8}/)||[''])[0]).toUpperCase().replace('-','');
    rest=rest.replace(am[0],' ').replace(/[A-Za-z]{2}-?\d{8}/,' ').replace(/[\s,，|]+/g,' ').trim();
    out.push({no,date,shop:rest,amt:num(am[1]),dt:''})});
  return out}
function invCat(s){
  const R=[[/捷運|加油|中油|台塑石油|停車|高鐵|台鐵|客運|Uber|計程|悠遊卡|一卡通|公車|ETC|遠通/i,'交通'],[/全聯|家樂福|大潤發|costco|好市多|美廉社|愛買|momo|寶雅/i,'家庭'],[/屈臣氏|康是美|美妝|美容|SK-?II|醫美/i,'保養'],[/蝦皮|PChome|博客來|IKEA|小米|蘋果|Apple|UNIQLO|NET|無印|百貨|誠品/i,'購物'],[/電影|影城|KTV|遊戲|網咖|Steam|Netflix/i,'娛樂'],[/診所|醫院|藥局|藥妝|牙/i,'醫療'],[/全家|7-?ELEVEN|統一超商|萊爾富|OK超商|餐|麥當勞|肯德基|拉麵|咖啡|星巴克|茶|飲|食|麵|飯|鍋|燒|壽司|麵包|烘焙|早餐|便當|甜點|foodpanda|Uber ?Eats/i,'飲食']];

function invAdd(list){
  const seen=new Set(S.invSeen||[]),pend=new Set((S.inv||[]).map(x=>x.key)),cnt={};let add=0,dup=0;S.inv=S.inv||[];

function invBar(){const n=(S.inv||[]).length;return n?`<div class="ivb" data-act="invgo"><b>🧾 ${n} 筆發票待確認</b><span>逐筆記帳 ›</span></div>`:''}

/* ---------- 發票照片辨識（QR 優先，文字辨識備援）---------- */
const PHOTO={};
let _jq;
function invJsqr(){if(window.jsQR)return Promise.resolve(window.jsQR);return _jq||(_jq=new Promise(res=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js';s.onload=()=>res(window.jsQR||null);s.onerror=()=>{_jq=null;res(null)};document.head.appendChild(s)}))}
const QL=/^[A-Za-z]{2}\d{8}\d{7}\d{4}[0-9a-fA-F]{16}/;
const hasL=set=>[...set].some(t=>QL.test(t));
async function invScan(img){
  const texts=new Set(),det=('BarcodeDetector' in window)?new BarcodeDetector({formats:['qr_code']}):null;
  const J=await invJsqr();
  const jobs=[];const W=img.naturalWidth,H=img.naturalHeight;
  [1600,1000,2400].forEach(m=>jobs.push([0,0,W,H,Math.min(1,m/Math.max(W,H))||1]));
  [[0,.4],[.5,.4],[0,0],[.5,0],[0,.55],[.5,.55]].forEach(([fx,fy])=>jobs.push([W*fx,H*fy,W*.55,H*.5,Math.min(2,1400/Math.max(W*.55,H*.5))]));
  for(const [sx,sy,sw,sh,k] of jobs){
    if(hasL(texts)&&texts.size>=2)break;
    const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(sw*k));cv.height=Math.max(1,Math.round(sh*k));
    const cx=cv.getContext('2d',{willReadFrequently:true});cx.drawImage(img,sx,sy,sw,sh,0,0,cv.width,cv.height);
    if(det){try{(await det.detect(cv)).forEach(r=>texts.add(r.rawValue))}catch(e){}}
    if(J){for(let i=0;i<3;i++){
      const d=cx.getImageData(0,0,cv.width,cv.height),r=J(d.data,cv.width,cv.height,{inversionAttempts:'attemptBoth'});if(!r)break;
      texts.add(r.data);const l=r.location,xs=[l.topLeftCorner,l.topRightCorner,l.bottomRightCorner,l.bottomLeftCorner],cxm=xs.reduce((q,p)=>q+p.x,0)/4,cym=xs.reduce((q,p)=>q+p.y,0)/4;
      cx.fillStyle='#fff';cx.beginPath();xs.forEach((p,j)=>{const x=cxm+(p.x-cxm)*1.25,y=cym+(p.y-cym)*1.25;j?cx.lineTo(x,y):cx.moveTo(x,y)});cx.closePath();cx.fill()}}
  }
  return [...texts]}
function invQr(texts){
  const L=texts.find(t=>QL.test(t));if(!L)return null;
  const no=L.slice(0,10).toUpperCase(),date=invD(L.slice(10,17)),amt=parseInt(L.slice(29,37),16)||0,seller=L.slice(45,53);
  const enc=(L.slice(77).split(':')[4]||'').trim();
  let tok=L.slice(77).split(':').slice(5);
  texts.filter(t=>t.startsWith('**')).forEach(t=>{tok=tok.concat(t.slice(2).split(':'))});
  tok=tok.map(x=>x.trim()).filter(x=>x!==''&&x!=='**');
  const nm=[];
  for(let i=0;i+2<tok.length;i+=3){if(/^[\d.]+$/.test(tok[i+1])&&/^-?[\d.]+$/.test(tok[i+2])){let n=tok[i];if(enc==='2'){try{n=new TextDecoder().decode(Uint8Array.from(atob(n),c=>c.charCodeAt(0)))}catch(e){}}nm.push(n)}}

async function invOcr(img){
  if(!confirm('讀不到發票 QR Code。要改用文字辨識嗎？\n（需下載約十幾 MB 的語言資料，較慢，也比較不準，結果請務必檢查）'))return null;
  toast('文字辨識中，請稍候…');
  await new Promise((ok,no)=>{if(window.Tesseract)return ok();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});

    const n=l.match(/[A-Za-z]{2}-?\d{8}/);if(!no&&n)no=n[0].toUpperCase().replace('-','')}
  for(const l of lines){if(/總計|合計|總額|應收|Total/i.test(l)){const m=[...l.matchAll(/[\d,]+/g)].map(x=>num(x[0])).filter(x=>x>0).pop();if(m){amt=m;break}}}
  const shop=lines.find(l=>/[一-龥]{2,}/.test(l)&&!/發票|電子|統一編號|隨機|格式|交易|明細/.test(l))||'';
  return{no,date,amt,shop:shop.slice(0,24),dt:'',seller:''}}
async function invPhotos(files){
  let added=0,fail=0,first=true;
  for(const f of files){
    try{
      toast('辨識發票中…');
      const url=URL.createObjectURL(f),img=new Image();img.src=url;await img.decode();
      let v=invQr(await invScan(img));
      if(!v){try{v=await invOcr(img)}catch(e){v=null}}
      if(!v||!v.date||!(v.amt>0)){fail++;URL.revokeObjectURL(url);continue}
      const key0=v.no||`${v.date}|${v.shop}|${v.amt}`;
      const r=invAdd([v]);

      else toast('這張發票已處理過或已在待確認清單')
    }catch(e){fail++}}
  $('#ts').style.display='none';
  if(TAB===3)settings();
  if(added)invNext();
  else if(fail)toast(`${fail} 張照片讀不到發票資料，請拍清楚一點（QR Code 要完整入鏡）`)}

   {n:'xl/styles.xml',d:H+`<styleSheet ${NS}><fonts count="2"><font><sz val="11"/><name val="Microsoft JhengHei"/></font><font><b/><sz val="11"/><name val="Microsoft JhengHei"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE8F3EF"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="5"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="3" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="3" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`},
   ...sheets.map((x,i)=>({n:`xl/worksheets/sheet${i+1}.xml`,d:sheetXml(x)}))];
  return zipStore(F)}
function buildSheets(o){o=o||{};const TX=S.tx.filter(t=>inR(t,o.f,o.t));
  const B=(r)=>{r.b=true;return r},ym=k=>k.replace('-','/');
  // 1 明細
  const dayE={};TX.forEach(t=>dayE[t.date]=(dayE[t.date]||0)+exp(t));
  const s1=[['消費日期','付款方式','銀行','類別','消費店名','消費明細','付款金額','我的支出','手續費','收入','分期數','每期金額','卡片權益','回饋%','應得回饋','已收回饋','未收回饋','付款狀態','備註','當日支出']];
  TX.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.id-b.id).forEach(t=>s1.push([t.date,t.pay,bankOf(t),t.cat,t.shop||'',t.dt||'',t.amt||0,t.ex||0,t.fee||0,t.inc||0,t.n,t.n>1?t.ia:'',t.perk||'',t.rp||0,Math.round(t.ra||0),Math.round(t.got||0),pend(t)?Math.max(0,Math.round(t.ra)-Math.round(t.got||0)):0,t.amt?(t.up?'未繳款':'已繳款'):'',t.note||'',dayE[t.date]]));
  // 2 每月回饋
  const MR={};TX.forEach(t=>{if(!(t.ra>0))return;const k=t.date.slice(0,7),ra=Math.round(t.ra),g=Math.min(ra,Math.round(t.got||0));const m=MR[k]=MR[k]||{};const c=m[t.pay]=m[t.pay]||[0,0];c[0]+=ra;c[1]+=g});
  const order=S.cards.map(c=>c.n),s2=[['月份','卡別','應得回饋','已收回饋','未收回饋']];let T=[0,0];
  Object.keys(MR).sort().forEach(k=>{const m=MR[k];let a=0,g=0;
    Object.keys(m).sort((x,y)=>(order.indexOf(x)+99)%99-(order.indexOf(y)+99)%99).forEach(p=>{s2.push([ym(k),p,m[p][0],m[p][1],m[p][0]-m[p][1]]);a+=m[p][0];g+=m[p][1]});
    s2.push(B([ym(k),'當月合計',a,g,a-g]));T[0]+=a;T[1]+=g});
  s2.push(B(['全部','累計合計',T[0],T[1],T[0]-T[1]]));
  // 3 金流
  const base=today().slice(0,7),s3=[['月份','區塊','扣款帳戶','卡別','項目','日期','金額（＋收入／－支出）','帳期歸屬','已確認']];
  [0,1,2].map(i=>shift(base,i)).forEach(k=>{const c=calcM(k),L=ym(k);
    c.mk.filter(m=>m.a>0).forEach(m=>s3.push([L,'預計收入','','',m.n,'',m.a]));
    c.accts.forEach(a=>{
      c.G[a.a].forEach(x=>{
        x.items.slice().sort((p,q)=>p.date<q.date?-1:1).forEach(t=>s3.push([L,'信用卡',a.a,x.c.n,t.shop||t.cat,t.date,-t.amt,t.first?'手動 '+ym(t.first)+' 帳單':'自動（依結帳日）',t.ok?'✓':'']));
        if(x.fee)s3.push([L,'信用卡',a.a,x.c.n,'手續費','',-x.fee]);
        x.inst.forEach(q=>s3.push([L,'信用卡',a.a,x.c.n,`${q.t.shop}（分期 ${q.k+1}/${q.t.n}，剩 ${q.t.n-q.k-1} 期）`,q.t.date,-q.t.ia]));
        if(x.p)s3.push([L,'信用卡',a.a,x.c.n,'點數折抵','',x.p]);
        s3.push(B([L,'信用卡',a.a,x.c.n,'本期卡費','',-x.bill]))});
      const gs=c.G[a.a];
      s3.push(B([L,'信用卡',a.a,'','卡費合計','',-a.due]));
      s3.push([L,'信用卡',a.a,'','點數折抵合計','',gs.reduce((q,x)=>q+x.p,0)]);
      s3.push([L,'信用卡',a.a,'','累積分期金額','',-a.ip]);
      s3.push([L,'信用卡',a.a,'','累積卡費金額（不含分期）','',-gs.reduce((q,x)=>q+x.spend,0)]);
      s3.push([L,'信用卡',a.a,'','是否有退款（僅記錄）',gs.some(x=>x.rf)?'有':'無',gs.reduce((q,x)=>q+x.rf,0)]);
      s3.push([L,'信用卡',a.a,'','活存餘額','',a.bal]);
      s3.push(B([L,'信用卡',a.a,'','還差（需備）','',-a.lack]))});
    c.mk.filter(m=>m.a<0).forEach(m=>s3.push([L,'其他支出','','',m.n,'',m.a]));
    s3.push(B([L,'淨金流','','','預估淨金流','',c.net]));
    s3.push([L,'回饋（參考，不計入淨金流）','','','預估回饋','',c.rew]);
    s3.push([L,'回饋（參考，不計入淨金流）','','','已入帳回饋','',c.gt]);
    s3.push([L,'回饋（參考，不計入淨金流）','','','未收回饋','',c.un])});
  // 4 分期
  const Bm=mi(base),s4=[['項目','卡別','消費日期','期數','總額','每期金額','首期帳單月','最後帳單月','進度','剩餘期數','剩餘金額','狀態']];
  S.inst.slice().sort((p,q)=>instSt(p)+p.n-instSt(q)-q.n).forEach(i=>{const st=instSt(i),end=st+i.n-1,k=Bm-st+1,done=end<Bm,left=done?0:i.n-Math.max(0,k-1);
    s4.push([i.item,i.pay,i.date,i.n,i.total,i.per,ym(ml(st)),ym(ml(end)),done?'已結案':k<1?'尚未開始':`第 ${k}/${i.n} 期`,left,i.per*left,done?'已結案':'進行中'])});
  // 5 卡片權益
  const s5=[['卡別','結帳日','扣款帳戶','權益','回饋%','條件／上限']];
  S.cards.forEach(c=>{if(!c.perks.length)s5.push([c.n,c.d,c.a,'一般',c.r,c.note||'']);c.perks.forEach(p=>s5.push([c.n,c.d,c.a,p.n,p.r,p.note||'']))});
  return[{name:'明細',rows:s1,w:[12,14,10,8,22,40,11,11,8,10,7,10,14,8,10,10,10,10,24,10]},
    {name:'每月回饋',rows:s2,w:[10,14,12,12,12]}].concat(o.extra===false?[]:[
    {name:'金流',rows:s3,w:[10,24,10,14,40,12,20,20,8]},
    {name:'分期',rows:s4,w:[28,14,12,6,10,10,12,12,12,10,12,10]},
    {name:'卡片權益',rows:s5,w:[14,8,10,18,8,60]}])}
function exportXlsx(){
  try{dl(xlsxBuild(buildSheets()),`記帳清單_${today().replace(/-/g,'')}.xlsx`);toast('已匯出 Excel 清單')}catch(err){toast('匯出失敗：'+err.message)}}

/* ---------- 定位提醒 ---------- */
let last=null,anchor=null,asked={},watching=false;
const dist=(a,b)=>{const r=Math.PI/180,x=(b.lng-a.lng)*r*Math.cos((a.lat+b.lat)*r/2),y=(b.lat-a.lat)*r;return Math.sqrt(x*x+y*y)*6371000};
function remind(place){
  const msg=place?`你在「${place.n}」附近，要記帳嗎？`:'你在這裡停留一陣子了，要記帳嗎？';
  $('#bt').textContent=msg;$('#bn').style.display='block';
  $('#bgo').onclick=()=>{$('#bn').style.display='none';openSheet();if(place)$('#f-shop').value=place.n};
  $('#bno').onclick=()=>$('#bn').style.display='none';
  if(window.Notification&&Notification.permission==='granted'){try{new Notification('記帳提醒',{body:msg})}catch(e){}}}
function onPos(p){
  last={lat:p.coords.latitude,lng:p.coords.longitude};const k=today();
  for(const pl of S.places){if(dist(pl,last)<100&&!asked[pl.n+k]){asked[pl.n+k]=1;remind(pl);return}}
  if(!anchor||dist(anchor,last)>80)anchor={lat:last.lat,lng:last.lng,t:Date.now(),p:0}}
setInterval(()=>{if(anchor&&!anchor.p&&Date.now()-anchor.t>18e4){anchor.p=1;remind(null)}},3e4);
$('#loc').onclick=async()=>{
  if(!navigator.geolocation){toast('這個瀏覽器不支援定位');return}
  if(watching){toast('定位提醒運作中，請保持頁面開啟');return}
  try{if(window.Notification&&Notification.permission==='default')await Notification.requestPermission()}catch(e){}
  navigator.geolocation.watchPosition(p=>{if(!watching){watching=true;$('#loc').style.background='var(--ac2)';toast('定位提醒已開啟：停留 3 分鐘或靠近已存店家會提醒')}onPos(p)},
    ()=>toast('無法取得定位，請允許位置權限'),{enableHighAccuracy:true,maximumAge:3e4})};

$('#top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
addEventListener('scroll',()=>$('#top').classList.toggle('show',scrollY>500),{passive:true});
applyTheme();render();
</script>
