<style>
:root{--bg:#f3f5f2;--sf:#fff;--tx:#1d2a26;--mu:#6b7a74;--ac:#1f6f5c;--ac2:#e8f3ef;--ln:#dde3df;--rd:#b4432f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;padding-bottom:130px;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;justify-content:space-between;align-items:center;max-width:560px;margin:0 auto;padding:12px 16px 6px;background:var(--bg)}
header b{font-size:20px}
main{max-width:560px;margin:0 auto;padding:6px 16px}
button,input,select,textarea{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:9px 10px;min-height:42px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button{border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:var(--bg);cursor:pointer;min-height:42px}
button.s{background:var(--ac2);color:var(--ac)}
button.sm{min-height:34px;padding:6px 12px;font-size:13px}
button.ic{background:none;color:var(--ac);font-size:20px;padding:4px 12px;min-height:38px}
button.lk{background:none;color:var(--mu);width:100%;margin-top:6px;font-size:13px}
label{display:block;font-size:12px;color:var(--mu);margin:0 0 3px}
.mn{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.mn b{font-size:17px}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.st>div{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px 9px}
.st>div.on{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
.st i{display:block;font-style:normal;font-size:12px;color:var(--mu)}
.st b{font-size:15px}
.dh{display:flex;justify-content:space-between;margin:16px 4px 6px;font-size:13px;color:var(--mu)}
.pn{background:var(--sf);border:1px solid var(--ln);border-radius:14px;overflow:hidden;margin-bottom:10px}
.en+.en,.pi+.pi{border-top:1px solid var(--ln)}
.sm2{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;cursor:pointer}
.sn{font-weight:600}
.ss{font-size:12px;color:var(--mu)}
.r{text-align:right;white-space:nowrap}
.a1{font-weight:700}
.a2{font-size:12px;color:var(--ac)}
.chip{display:inline-block;margin-top:4px;font-size:11px;padding:1px 9px;border-radius:99px;background:color-mix(in srgb,var(--rd) 13%,transparent);color:var(--rd)}
.dtl{padding:0 14px 14px;font-size:13px;display:grid;gap:8px}
.dtl .g2{align-items:end}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{grid-column:1/-1}
.pi{padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.pi input{width:92px;min-height:36px;padding:5px 8px}
.pnl{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.pnl h3{margin:0 0 8px;font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}
.tb2{width:100%;border-collapse:collapse}
.tb2 th{font-weight:400;font-size:12px;color:var(--mu)}
.tb2 td,.tb2 th{padding:7px 3px;text-align:right}
.tb2 td:first-child,.tb2 th:first-child{text-align:left}
.tb2 input{width:92px;min-height:36px;padding:4px 8px;text-align:right}
.chips{display:flex;gap:8px;margin:4px 0 12px;overflow-x:auto}
.chips button{background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:99px;min-height:36px;padding:6px 16px}
.chips button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.tl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.tl div{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:15px}
.tl i{display:block;font-style:normal;font-size:11px;color:var(--mu)}
.tl input{min-height:30px;padding:2px 6px;text-align:left;background:var(--sf)}
.bar{height:6px;background:var(--ac2);border-radius:9px;overflow:hidden;margin-top:4px}
.bar span{display:block;height:100%;background:var(--ac)}
.mu{color:var(--mu);font-size:12px}
.in{color:var(--ac)}
.bad{color:var(--rd)}
.em{text-align:center;color:var(--mu);padding:40px 10px}
.x{background:none;color:var(--rd);min-height:0;padding:4px 8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:8}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:14px 0}
nav button.on{color:var(--ac);font-weight:700;box-shadow:inset 0 3px 0 var(--ac)}
#fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(68px + env(safe-area-inset-bottom,0px));border-radius:99px;padding:12px 24px;box-shadow:0 4px 16px rgba(0,0,0,.22);z-index:7}
#bn{display:none;position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:5;background:var(--ac);color:var(--bg);border-radius:12px;padding:12px;margin:0 0 10px}
#bn button{background:var(--bg);color:var(--ac);margin:8px 8px 0 0}
#ov,#ov2{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
.sh{position:absolute;left:0;right:0;bottom:0;margin:0 auto;width:100%;max-width:560px;max-height:94%;overflow:auto;background:var(--sf);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.shh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:17px}
#f-amt,#f-ex{font-size:20px;font-weight:700}
.ro{min-height:42px;display:flex;align-items:center;color:var(--ac);font-weight:700}
details{margin:12px 0 0}
summary{cursor:pointer;color:var(--ac);padding:6px 0}
details .g2{margin-top:8px}
#ts{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:130px;background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:99px;z-index:30;font-size:13px}
.sr{display:flex;gap:8px;margin:0 0 10px}
.sr select{flex:0 0 38%;min-width:0}
.sr input{flex:1;min-width:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:8px 6px;margin-bottom:6px;text-align:center}
.cal i{font-style:normal;font-size:11px;color:var(--mu);padding:2px 0}
.cal .cd{position:relative;background:none;color:var(--ln);min-height:40px;padding:0;border-radius:10px;font-size:14px}
.cal .cd.has{color:var(--tx);font-weight:600;cursor:pointer}
.cal .cd.has::after{content:"";position:absolute;left:50%;bottom:5px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--ac)}
.cal .cd.has:active{background:var(--ac2)}
.cal .cd.td{box-shadow:inset 0 0 0 1.5px var(--ac)}
.dh{scroll-margin-top:68px}
.dh.fl{animation:fl 1.6s ease-out}
@keyframes fl{0%,40%{background:var(--ac2)}100%{background:transparent}}
.mcs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.mc{background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:14px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:0}

.pk{display:grid;grid-template-columns:1fr 76px auto;gap:6px;margin:8px 0}

a{color:var(--ac)}

.tg{margin-left:4px}

let _tess,_wk;
function invTess(){if(window.Tesseract)return Promise.resolve();return _tess||(_tess=new Promise((ok,no)=>{const q=document.createElement('script');q.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';q.onload=ok;q.onerror=()=>{_tess=null;no(new Error('load'))};document.head.appendChild(q)}))}
async function invWorker(){

function invPrep(img){

function invLines(t){

function invShot(text){

  const cjk=l=>/[\u4e00-\u9fff]{2,}/.test(l),isCo=l=>/公司|商行|企業|有限|分公司/.test(l),notMeta=l=>!/\d{4}\s*[\/\-.]\s*\d|載具|總計|消費品項|發票|\$/.test(l);

/* ---------- 定位提醒 ---------- */
let last=null,anchor=null,asked={},watching=false;
const dist=(a,b)=>{const r=Math.PI/180,x=(b.lng-a.lng)*r*Math.cos((a.lat+b.lat)*r/2),y=(b.lat-a.lat)*r;return Math.sqrt(x*x+y*y)*6371000};
function remind(place){
  const msg=place?`你在「${place.n}」附近，要記帳嗎？`:'你在這裡停留一陣子了，要記帳嗎？';
  $('#bt').textContent=msg;$('#bn').style.display='block';
  $('#bgo').onclick=()=>{$('#bn').style.display='none';openSheet();if(place)$('#f-shop').value=place.n};
  $('#bno').onclick=()=>$('#bn').style.display='none';
  if(window.Notification&&Notification.permission==='granted'){try{new Notification('記帳提醒',{body:msg})}catch(e){}}}
function onPos(p){
  last={lat:p.coords.latitude,lng:p.coords.longitude};const k=today();
  for(const pl of S.places){if(dist(pl,last)<100&&!asked[pl.n+k]){asked[pl.n+k]=1;remind(pl);return}}
  if(!anchor||dist(anchor,last)>80)anchor={lat:last.lat,lng:last.lng,t:Date.now(),p:0}}
setInterval(()=>{if(anchor&&!anchor.p&&Date.now()-anchor.t>18e4){anchor.p=1;remind(null)}},3e4);
$('#loc').onclick=async()=>{
  if(!navigator.geolocation){toast('這個瀏覽器不支援定位');return}
  if(watching){toast('定位提醒運作中，請保持頁面開啟');return}
  try{if(window.Notification&&Notification.permission==='default')await Notification.requestPermission()}catch(e){}
  navigator.geolocation.watchPosition(p=>{if(!watching){watching=true;$('#loc').style.background='var(--ac2)';toast('定位提醒已開啟：停留 3 分鐘或靠近已存店家會提醒')}onPos(p)},
    ()=>toast('無法取得定位，請允許位置權限'),{enableHighAccuracy:true,maximumAge:3e4})};

$('#top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
